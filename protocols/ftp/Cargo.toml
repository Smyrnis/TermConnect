[package]
name = "porthmos-ftp"
description = "FTP and FTPS protocol support for Porthmos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
porthmos-vfs.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sha2 = "0.10"
suppaftp = { version = "12.1", features = ["tokio-rustls-aws-lc-rs", "deprecated"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
webpki-roots = "1"
x509-parser = "0.18"

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
libunftp = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rcgen = "0.14"
unftp-core = "0.1"
unftp-sbe-fs = "0.4"
