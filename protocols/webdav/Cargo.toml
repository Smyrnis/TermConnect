[package]
name = "porthmos-webdav"
description = "WebDAV protocol support for Porthmos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
porthmos-tls.workspace = true
porthmos-vfs.workspace = true
tokio.workspace = true
base64 = "0.22"
bytes = "1"
digest_auth = "0.3.1"
httpdate = "1"
percent-encoding = "2.3"
quick-xml = "0.42"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
md-5 = "0.10"
rcgen = "0.14"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
