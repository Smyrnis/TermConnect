[package]
name = "porthmos-ssh"
description = "SSH connections shared by the Porthmos protocols that run over SSH"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
testing = ["dep:tempfile", "tokio/process"]

[dependencies]
anyhow.workspace = true
porthmos-vfs.workspace = true
russh.workspace = true
tokio.workspace = true
tracing.workspace = true
tempfile = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "process"] }
porthmos-ssh = { path = ".", features = ["testing"] }
