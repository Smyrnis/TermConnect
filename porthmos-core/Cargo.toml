[package]
name = "porthmos-core"
description = "The UI-free engine behind Porthmos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sftp"]
sftp = ["dep:porthmos-sftp"]
testing = ["porthmos-vfs/testing"]

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
serde.workspace = true
porthmos-lfs.workspace = true
porthmos-vfs.workspace = true
porthmos-sftp = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
porthmos-vfs = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
