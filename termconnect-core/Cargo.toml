[package]
name = "termconnect-core"
description = "The UI-free engine behind TermConnect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["sftp"]
sftp = ["dep:termconnect-sftp"]
testing = ["termconnect-vfs/testing"]

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
serde.workspace = true
termconnect-lfs.workspace = true
termconnect-vfs.workspace = true
termconnect-sftp = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
termconnect-vfs = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }
