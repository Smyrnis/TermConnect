[package]
name = "termconnect"
version = "0.1.0"
edition = "2024"
description = "A terminal file manager for browsing local files alongside SSH/SFTP connections"
license = "MIT"
repository = "https://github.com/Smyrnis/TermConnect"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = "0.30.2"
russh = "0.63.3"
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
