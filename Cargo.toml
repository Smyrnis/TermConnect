[workspace]
resolver = "3"
members = ["termconnect-*", "protocols/*"]
default-members = ["termconnect-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Smyrnis/TermConnect"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = "0.30.2"
russh = "0.63.3"
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
termconnect-vfs = { path = "termconnect-vfs" }
termconnect-lfs = { path = "termconnect-lfs" }
termconnect-sftp = { path = "protocols/sftp" }
termconnect-core = { path = "termconnect-core" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
