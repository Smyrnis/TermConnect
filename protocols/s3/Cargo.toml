[package]
name = "porthmos-s3"
description = "S3-compatible object storage support for Porthmos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
futures-util.workspace = true
porthmos-tls.workspace = true
porthmos-vfs.workspace = true
tokio.workspace = true
base64 = "0.22"
bytes = "1"
hex = "0.4"
hmac = "0.12"
http = "1"
httpdate = "1"
md-5 = "0.10"
percent-encoding = "2.3"
quick-xml = "0.42"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
sha2 = "0.10"
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
async-trait.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.14"
s3s = "0.14"
s3s-fs = "0.14"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
